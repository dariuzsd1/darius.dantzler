*{box-sizing:border-box}

.pill{pointer-events:auto;width:100%;max-width:1120px;display:flex;align-items:center;gap:22px;padding:11px 14px 11px 24px;border-radius:999px;border:1px solid rgba(20,20,20,.12);background:rgba(248,246,240,.82);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);box-shadow:0 1px 1px rgba(20,20,20,.03),0 8px 26px rgba(20,20,20,.09)}

.lang{position:relative}

<script>
/* ---------- language dropdown (shared) ---------- */
const lang=document.getElementById('lang'), langBtn=document.getElementById('langBtn');
langBtn.addEventListener('click',e=>{e.stopPropagation();const open=lang.classList.toggle('open');langBtn.setAttribute('aria-expanded',open);});
document.addEventListener('click',()=>{lang.classList.remove('open');langBtn.setAttribute('aria-expanded','false');});
lang.querySelectorAll('.lang-item').forEach(it=>it.addEventListener('click',e=>{e.stopPropagation();lang.querySelectorAll('.lang-item').forEach(x=>x.setAttribute('aria-checked','false'));it.setAttribute('aria-checked','true');lang.classList.remove('open');langBtn.setAttribute('aria-expanded','false');}));

/* ================= DATA (the whole interface — swap the real record in later) =================
   Shape: { id, role, org, location, start, end, summary, highlights:[] }
   highlights omitted or [] → no "more" toggle. */
const experience = [
  { id:"e10", role:"Treasurer", org:"European Space Hub", location:"DE / FR",
    start:"2026", end:"Present", feat:true,
    summary:"Handle the finances for every student on the programme, and built the application that supervisors and students both use to settle reimbursements.",
    highlights:[
      "Built the reimbursement tool end to end: supervisors see what each student is owed, students log the expenses tied to their internship activities.",
      "Sat on the team expanding the organisation into France, standing up a new branch and its operations.",
      "Developed startup concepts through ignition programmes to prepare an ESA grant proposal, which is still to be submitted."
    ] },
  { id:"e1", role:"Intercultural Events Facilitator", org:"International Space University", location:"Strasbourg, FR",
    start:"2025", end:"2026",
    summary:"Planned and hosted [[five]] intercultural events for ISU students, staff, and faculty." },
  { id:"e8", role:"Humanitarian Operations Volunteer", org:"Voice360 Ukraine", location:"DE / UA / PL",
    start:"2021", end:"2025", feat:true,
    summary:"Ran cross-border relief in an active conflict zone: moved [[20+ refugees]] from Poland to Germany and delivered [[~12 tons]] of aid as a [[trilingual]] English, German, and Russian liaison.",
    highlights:[
      "Coordinated [[5+ supply runs]] into Uzhhorod, Ukraine and Kraków and Przemyśl, Poland.",
      "Found emergency overnight housing for women and children after an intake center closed with no warning.",
      "Translated German and Russian paperwork so a newly arrived family could file for residency."
    ] },
  { id:"e2", role:"Chiefs of Mission Conference Planner", org:"U.S. European Command (USEUCOM)", location:"Stuttgart, DE",
    start:"2024", end:"2024", feat:true,
    summary:"Ran planning for a four-star conference of [[46+ U.S. Ambassadors]] and Chargés d'Affaires, lining up DoD, State Department, and NATO officials on European security. Earned a [[4-Star Coin]] from the Commander, USEUCOM.",
    highlights:[
      "Was the liaison across Protocol, the State Department, and Allied embassies for senior principals.",
      "Built an Excel and Word mail merge that generated credentials for [[46+ principals]] with no manual entry.",
      "Ran [[60+ microphones]] and breakout rooms live through the whole event.",

    ] },

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const T=(k,d)=>(window.ddsI18n&&window.ddsI18n.t(k))||d;
function fig(s){ return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="fig">$1</span>'); }

const tl=document.getElementById('timeline');

/* A role still running sorts above every finished one. Everything else
   orders by when it ended, then by when it started, so a long-running
   entry cannot jump ahead of a more recent short one. */
function yr(v){
  if(/present|current|now/i.test(v||'')) return 9999;
  const m=String(v||'').match(/\d{4}/);
  return m ? +m[0] : 0;
}
const ordered = experience.slice().sort((a,b)=>
  yr(b.end)-yr(a.end) || yr(b.start)-yr(a.start)
);

ordered.forEach(e=>{
  const isCurrent = /present|current|now/i.test(e.end||"");
  const hasHl = Array.isArray(e.highlights) && e.highlights.length>0;
  const entry=document.createElement('article');
  entry.className='entry'+(isCurrent?' current':'')+(e.feat?' featured':'');

  const endHTML = isCurrent
    ? '<span class="now-tag">'+esc(e.end)+'</span>'
    : esc(e.end);
  const locHTML = e.location ? '<span class="loc">'+esc(e.location)+'</span>' : '';
  const featHTML = e.feat ? '<span class="feat-tag" data-i18n="ex.keyrole">'+T('ex.keyrole','Key role')+'</span>' : '';

  let html =
    '<span class="marker" aria-hidden="true"></span>'+
    '<div class="dates">'+featHTML+esc(e.start)+' &ndash; '+endHTML+locHTML+'</div>'+
    '<h2>'+esc(e.role)+'</h2>'+
    '<div class="org"><strong>'+esc(e.org)+'</strong></div>'+
    '<p class="summary">'+fig(e.summary)+'</p>';

  if(hasHl){
    const hlId='hl-'+e.id;
    html +=
      '<button class="more-toggle" type="button" aria-expanded="false" aria-controls="'+hlId+'">'+
        '<span class="txt-more" data-i18n="ex.more">'+T('ex.more','More')+'</span><span class="txt-less" data-i18n="ex.less">'+T('ex.less','Less')+'</span>'+
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'+
      '</button>'+
      '<div class="highlights" id="'+hlId+'"><ul>'+
        e.highlights.map(h=>'<li>'+fig(h)+'</li>').join('')+
      '</ul></div>';
  }

  entry.innerHTML=html;
  tl.appendChild(entry);

  if(hasHl){
    const btn=entry.querySelector('.more-toggle');
    const panel=entry.querySelector('.highlights');
    btn.addEventListener('click',()=>{
      const open = btn.getAttribute('aria-expanded')==='true';
      btn.setAttribute('aria-expanded', open?'false':'true');
      panel.style.maxHeight = open ? '0px' : panel.scrollHeight+'px';
    });
  }
});
const cvModal=document.getElementById('cvModal');
function openCV(){cvModal.classList.add('open');cvModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
function closeCV(){cvModal.classList.remove('open');cvModal.setAttribute('aria-hidden','true');document.body.style.overflow='';}
document.querySelectorAll('[data-cv-open]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();openCV();}));
document.querySelectorAll('[data-cv-close]').forEach(el=>el.addEventListener('click',closeCV));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCV();});
