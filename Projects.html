<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects · Darius Dantzler</title>
<meta name="description" content="Three things Darius Dantzler is building: a diabetes supply tracker, an industrial emissions map for Baden-Wurttemberg, and a reimbursement tool for a space non-profit.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://darius-dantzler.vercel.app/Projects.html">
<meta property="og:site_name" content="Darius Dantzler">
<meta property="og:title" content="Projects · Darius Dantzler">
<meta property="og:description" content="Three things Darius Dantzler is building: a diabetes supply tracker, an industrial emissions map for Baden-Wurttemberg, and a reimbursement tool for a space non-profit.">
<meta property="og:image" content="https://darius-dantzler.vercel.app/assets/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://darius-dantzler.vercel.app/Projects.html">
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--dds-color-bone);color:var(--dds-color-ink);font-family:var(--dds-font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--dds-color-ink);text-decoration:none}
a:hover{color:var(--dds-color-ink)}

.vignette{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, rgba(242,194,48,.05), transparent 55%),
  radial-gradient(140% 120% at 50% 42%, rgba(245,243,236,0) 55%, rgba(20,20,20,.05) 100%)}

/* floating pill header (shared identity) */
.pillbar{position:fixed;top:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.pill{pointer-events:auto;width:100%;max-width:1120px;display:flex;align-items:center;gap:22px;padding:11px 14px 11px 24px;border-radius:999px;border:1px solid rgba(20,20,20,.12);background:rgba(248,246,240,.82);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);box-shadow:0 1px 1px rgba(20,20,20,.03),0 8px 26px rgba(20,20,20,.09)}
.brand{font-family:var(--dds-font-serif);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;padding-right:4px}
.navlinks{display:flex;align-items:center;gap:20px;margin-left:auto}
.navlink{font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(20,20,20,.6);border-bottom:2px solid transparent;padding:2px 0;transition:color .15s,border-color .15s;white-space:nowrap}
.navlink:hover{color:var(--dds-color-ink)}
.navlink.active{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
.pill-tools{display:flex;align-items:center;gap:6px;padding-left:14px;margin-left:2px;border-left:1px solid rgba(20,20,20,.12)}
.icobtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid transparent;color:rgba(20,20,20,.7);background:transparent;cursor:pointer;transition:background .15s,color .15s}
.icobtn:hover{background:rgba(20,20,20,.06);color:var(--dds-color-ink)}
.icobtn:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:2px}
.icobtn svg{width:18px;height:18px;display:block}
.lang{position:relative}
.lang-menu{position:absolute;top:calc(100% + 12px);right:0;min-width:172px;background:var(--dds-color-bone);border:1px solid rgba(20,20,20,.14);border-radius:14px;box-shadow:0 10px 30px rgba(20,20,20,.14);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s}
.lang.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0)}
.lang-head{font-family:var(--dds-font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(20,20,20,.45);padding:8px 10px 6px}
.lang-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;padding:9px 10px;border-radius:9px;font-family:var(--dds-font-sans);font-size:.9rem;color:var(--dds-color-ink);transition:background .12s}
.lang-item:hover{background:rgba(20,20,20,.06)}
.lang-item:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:-2px}
.lang-item .code{font-family:var(--dds-font-mono);font-size:.66rem;color:rgba(20,20,20,.5)}
.lang-item[aria-checked="true"] .code{color:var(--dds-color-ink)}
.lang-item .tick{width:14px;height:14px;color:var(--dds-color-accent);opacity:0}
.lang-item[aria-checked="true"] .tick{opacity:1}

.wrap{position:relative;z-index:1}
.container{max-width:1120px;margin:0 auto;padding:0 24px}

/* intro */
.pr-head{padding-top:148px;padding-bottom:10px}
.crumb{display:inline-flex;align-items:center;gap:8px;font-family:var(--dds-font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(20,20,20,.5);margin-bottom:22px}
.crumb a{color:rgba(20,20,20,.5);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.crumb a:hover{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
.pr-head .kick{display:inline-block;font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--dds-color-accent);color:var(--dds-color-ink);padding:5px 11px;border:1px solid rgba(20,20,20,.2)}
.pr-head h1{font-family:var(--dds-font-serif);font-weight:600;letter-spacing:-.01em;font-size:clamp(2.6rem,6vw,4rem);line-height:1.05;margin:18px 0 0}
.pr-head .dek{margin-top:14px;font-size:1.16rem;line-height:1.55;color:rgba(20,20,20,.7);max-width:600px}

/* ===== timeline ===== */
.timeline{position:relative;padding:34px 0 20px;margin-left:6px}
.tl-rail{position:absolute;left:19px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,rgba(20,20,20,.06),rgba(20,20,20,.22) 8%,rgba(20,20,20,.22) 92%,rgba(20,20,20,.06));border-radius:2px}
.tl-item{position:relative;padding-left:64px;padding-bottom:34px}
.tl-item:last-child{padding-bottom:6px}
/* node */
.tl-node{position:absolute;left:11px;top:26px;width:18px;height:18px;border-radius:50%;background:var(--dds-color-bone);border:2px solid var(--dds-color-ink);z-index:2}
.tl-node::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--st-color,rgba(20,20,20,.35))}
.tl-item.is-hero .tl-node{width:24px;height:24px;left:8px;top:24px;border-color:var(--dds-color-ink);box-shadow:0 0 0 5px rgba(242,194,48,.35)}
.tl-item.is-hero .tl-node::after{inset:4px;background:var(--dds-color-accent)}

/* card */
.tl-card{position:relative;display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--dds-color-bone);border:1px solid rgba(20,20,20,.7);border-radius:14px;padding:20px 22px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 26px rgba(20,20,20,.08);transition:transform .18s,box-shadow .18s}
.tl-card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--st-color,rgba(20,20,20,.3))}
.tl-card:hover{transform:translateX(3px);box-shadow:0 14px 30px rgba(20,20,20,.14)}
.tl-card:focus-visible{outline:none;box-shadow:0 0 0 2px var(--dds-color-ink),0 0 0 5px rgba(242,194,48,.5)}
.tl-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:11px}
.tl-dates{font-family:var(--dds-font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(20,20,20,.55)}
.tl-status{white-space:nowrap;font-family:var(--dds-font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid var(--st-color,rgba(20,20,20,.4));color:var(--st-ink,var(--dds-color-ink));background:var(--st-bg,transparent)}
.tl-title{font-family:var(--dds-font-serif);font-weight:600;letter-spacing:-.01em;font-size:1.34rem;line-height:1.14}
.tl-sub{font-size:.98rem;line-height:1.5;color:rgba(20,20,20,.68);margin-top:7px;max-width:64ch;text-wrap:pretty}
.tl-more{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--dds-font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dds-color-ink);border-bottom:1px solid rgba(20,20,20,.25);padding-bottom:2px;transition:border-color .15s,gap .15s}
.tl-card:hover .tl-more{border-bottom-color:var(--dds-color-accent);gap:11px}
.tl-more svg{width:14px;height:14px}

/* HERO — bigger presence, still in chronological place */
.tl-item.is-hero .tl-card{background:var(--dds-color-ink);border-color:var(--dds-color-ink);color:var(--dds-color-bone);padding:30px 32px}
.tl-item.is-hero .tl-card::before{background:var(--dds-color-accent);top:20px;bottom:20px;width:5px}
.tl-item.is-hero .tl-card:hover{box-shadow:0 20px 44px rgba(20,20,20,.3)}
.tl-item.is-hero .tl-flag{display:inline-flex;align-items:center;gap:7px;font-family:var(--dds-font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dds-color-accent);margin-bottom:12px}
.tl-item.is-hero .tl-flag::before{content:"";width:16px;height:1px;background:var(--dds-color-accent)}
.tl-item.is-hero .tl-dates{color:rgba(245,243,236,.6)}
.tl-item.is-hero .tl-title{font-size:2rem;line-height:1.06;margin-top:2px}
.tl-item.is-hero .tl-sub{color:rgba(245,243,236,.8);font-size:1.06rem;max-width:70ch;margin-top:11px}
.tl-item.is-hero .tl-status{border-color:rgba(245,243,236,.4);color:rgba(245,243,236,.9)}
.tl-item.is-hero .tl-more{color:var(--dds-color-bone);border-bottom-color:rgba(245,243,236,.4)}
.tl-item.is-hero .tl-card:hover .tl-more{border-bottom-color:var(--dds-color-accent)}
.tl-flag{display:none}

@media(max-width:600px){
  .pr-head{padding-top:120px}
  .tl-item{padding-left:52px}
  .tl-item.is-hero .tl-title{font-size:1.6rem}
  .tl-card{padding:17px 18px}
  .tl-item.is-hero .tl-card{padding:24px 22px}
}
@media(max-width:860px){.navlinks{display:none}}
@media (prefers-reduced-motion:reduce){.tl-card{transition:none}.tl-card:hover{transform:none}}

.pr-foot{border-top:1px solid rgba(20,20,20,.15);margin-top:36px}
.pr-foot .inner{max-width:1120px;margin:0 auto;padding:34px 24px 60px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(20,20,20,.55)}
.pr-foot a{color:rgba(20,20,20,.55);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.pr-foot a:hover{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
</style>
</head>
<body>
<div class="vignette"></div>

<div id="site-header"></div>

<div class="wrap">
  <header class="pr-head container">
    <div class="crumb"><a href="index.html" data-i18n="crumb.home">Home</a> <span>/</span> <span class="kick" data-i18n="nav.projects">Projects</span></div>
    <h1 data-i18n="pr.title">Things I've shipped</h1>
    <p class="dek" data-i18n="pr.dek">Work I've designed and built, laid out on a timeline. Pick any one to read the full case.</p>
  </header>

  <div class="container">
    <section class="timeline" id="timeline" aria-label="Project timeline">
      <div class="tl-rail" aria-hidden="true"></div>
    </section>
  </div>

  <footer class="pr-foot">
    <div class="inner">
      <span>Darius Dantzler · Projects</span>
      <a href="index.html" data-i18n="ex.backhome">Back home</a>
    </div>
  </footer>
</div>

<script src="projects-data.js"></script>
<script>

/* flip to true to preview placeholder entries and stress-test the timeline */
const SHOW_PLACEHOLDERS = false;

const STATUS = window.PROJECT_STATUS;
const STATUS_COLOR = {
  "in-progress": "#f2c230",
  "shipped":     "#17693a",
  "concept":     "#8a8a86"
};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const T=(k,d)=>(window.ddsI18n&&window.ddsI18n.t(k))||d;

const tl = document.getElementById('timeline');

/* chronological: newest at the top, oldest at the bottom */
const items = (window.PROJECTS||[])
  .filter(p => SHOW_PLACEHOLDERS || !p.placeholder)
  .slice()
  .sort((a,b) => (b.year||0) - (a.year||0));

items.forEach(p=>{
  const color = STATUS_COLOR[p.status] || "rgba(20,20,20,.4)";
  const item = document.createElement('div');
  item.className = 'tl-item' + (p.hero ? ' is-hero' : '');
  item.style.setProperty('--st-color', color);

  const card = document.createElement('a');
  card.className = 'tl-card';
  card.href = 'Project.html?id=' + encodeURIComponent(p.id);
  card.setAttribute('aria-label', 'Read more about ' + p.title);

  card.innerHTML =
    (p.hero ? '<span class="tl-flag" data-i18n="pr.featured">'+T('pr.featured','Featured project')+'</span>' : '') +
    '<div class="tl-meta">' +
      '<span class="tl-dates">' + esc(p.dates || '') + '</span>' +
      '<span class="tl-status" data-i18n="pr.status.'+p.status+'">' + esc(T('pr.status.'+p.status, STATUS[p.status] || p.status || '')) + '</span>' +
    '</div>' +
    '<div class="tl-title">' + esc(p.title) + '</div>' +
    (p.subtitle ? '<p class="tl-sub">' + esc(p.subtitle) + '</p>' : '') +
    '<span class="tl-more"><span data-i18n="pr.readmore">'+T('pr.readmore','Read more')+'</span>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
    '</span>';

  const node = document.createElement('span');
  node.className = 'tl-node';
  node.setAttribute('aria-hidden','true');

  item.appendChild(node);
  item.appendChild(card);
  tl.appendChild(item);
});
</script>
<script src="i18n.js"></script>
<script src="site-chrome.js"></script>
</body>
</html>
