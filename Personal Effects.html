<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--dds-color-bone);color:var(--dds-color-ink);font-family:var(--dds-font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--dds-color-ink);text-decoration:none}
a:hover{color:var(--dds-color-ink)}

.vignette{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, rgba(242,194,48,.05), transparent 55%),
  radial-gradient(140% 120% at 50% 42%, rgba(245,243,236,0) 55%, rgba(20,20,20,.05) 100%)}

/* floating pill header (shared identity) */
.pillbar{position:fixed;top:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.pill{pointer-events:auto;width:100%;max-width:1120px;display:flex;align-items:center;gap:22px;padding:11px 14px 11px 24px;border-radius:999px;border:1px solid rgba(20,20,20,.12);background:rgba(248,246,240,.82);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);box-shadow:0 1px 1px rgba(20,20,20,.03),0 8px 26px rgba(20,20,20,.09)}
.brand{font-family:var(--dds-font-serif);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;padding-right:4px}
.navlinks{display:flex;align-items:center;gap:20px;margin-left:auto}
.navlink{font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(20,20,20,.6);border-bottom:2px solid transparent;padding:2px 0;transition:color .15s,border-color .15s;white-space:nowrap}
.navlink:hover{color:var(--dds-color-ink)}
.navlink.active{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
.pill-tools{display:flex;align-items:center;gap:6px;padding-left:14px;margin-left:2px;border-left:1px solid rgba(20,20,20,.12)}
.icobtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid transparent;color:rgba(20,20,20,.7);background:transparent;cursor:pointer;transition:background .15s,color .15s}
.icobtn:hover{background:rgba(20,20,20,.06);color:var(--dds-color-ink)}
.icobtn:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:2px}
.icobtn svg{width:18px;height:18px;display:block}
.lang{position:relative}
.lang-menu{position:absolute;top:calc(100% + 12px);right:0;min-width:172px;background:var(--dds-color-bone);border:1px solid rgba(20,20,20,.14);border-radius:14px;box-shadow:0 10px 30px rgba(20,20,20,.14);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s}
.lang.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0)}
.lang-head{font-family:var(--dds-font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(20,20,20,.45);padding:8px 10px 6px}
.lang-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;padding:9px 10px;border-radius:9px;font-family:var(--dds-font-sans);font-size:.9rem;color:var(--dds-color-ink);transition:background .12s}
.lang-item:hover{background:rgba(20,20,20,.06)}
.lang-item:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:-2px}
.lang-item .code{font-family:var(--dds-font-mono);font-size:.66rem;color:rgba(20,20,20,.5)}
.lang-item[aria-checked="true"] .code{color:var(--dds-color-ink)}
.lang-item .tick{width:14px;height:14px;color:var(--dds-color-accent);opacity:0}
.lang-item[aria-checked="true"] .tick{opacity:1}

.wrap{position:relative;z-index:1}
.container{max-width:1120px;margin:0 auto;padding:0 24px}

/* intro */
.pe-head{padding-top:148px;padding-bottom:8px}
.crumb{display:inline-flex;align-items:center;gap:8px;font-family:var(--dds-font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(20,20,20,.5);margin-bottom:22px}
.crumb a{color:rgba(20,20,20,.5);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.crumb a:hover{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
.backbtn{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;font-family:var(--dds-font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(20,20,20,.6);border:1px solid rgba(20,20,20,.18);border-radius:999px;padding:8px 15px 8px 12px;background:rgba(248,246,240,.6);transition:background .15s,color .15s,border-color .15s}
.backbtn:hover{background:var(--dds-color-ink);color:var(--dds-color-bone);border-color:var(--dds-color-ink)}
.backbtn:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:2px}
.backbtn svg{width:15px;height:15px}
.pe-head .kick{display:inline-block;white-space:nowrap;font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--dds-color-accent);color:var(--dds-color-ink);padding:5px 11px;border:1px solid rgba(20,20,20,.2)}
.pe-head h1{font-family:var(--dds-font-serif);font-weight:600;letter-spacing:-.01em;font-size:clamp(2.6rem,6vw,4rem);line-height:1.05;margin:18px 0 0}
.pe-head .dek{margin-top:14px;font-size:1.16rem;line-height:1.55;color:rgba(20,20,20,.7);max-width:600px}

/* ===== reusable bento wall ===== */
.pe-section{padding:26px 0 6px}
.pe-label{font-family:var(--dds-font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:rgba(20,20,20,.42);display:inline-flex;align-items:center;gap:9px;margin-bottom:18px}
.pe-label::before{content:"";width:20px;height:1px;background:var(--dds-color-accent)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;grid-auto-flow:dense;gap:16px;padding-bottom:22px}

.tile{position:relative;padding:0;margin:0;border:1px solid rgba(20,20,20,.72);border-radius:10px;overflow:hidden;background:var(--dds-color-bone);cursor:pointer;display:block;
  grid-column:span 1;grid-row:span 1;
  transition:transform .2s ease,box-shadow .2s ease}
.tile.featured{grid-column:span 2;grid-row:span 2}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,20,20,.14);z-index:2}
.tile:focus-visible{outline:none;box-shadow:0 0 0 2px var(--dds-color-ink),0 0 0 5px rgba(242,194,48,.55)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,20,.86);color:var(--dds-color-bone);
  padding:15px 16px 15px;text-align:left;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.22,.61,.36,1)}
.tile.featured .cap{padding:19px 20px}
.cap .cap-kick{font-family:var(--dds-font-mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dds-color-accent)}
.cap .cap-title{font-family:var(--dds-font-serif);font-weight:600;font-size:1.02rem;line-height:1.15;letter-spacing:-.01em;margin-top:5px}
.tile.featured .cap .cap-title{font-size:1.24rem}
.cap .cap-text{font-family:var(--dds-font-sans);font-size:.82rem;line-height:1.4;color:rgba(245,243,236,.72);margin-top:6px}
.tile.featured .cap .cap-text{font-size:.9rem}
.tile:hover .cap,.tile:focus-visible .cap,.tile.show .cap{transform:translateY(0)}

@media(max-width:820px){.bento{grid-template-columns:repeat(3,1fr);grid-auto-rows:180px}}
@media(max-width:560px){
  .pe-head{padding-top:120px}
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:12px}
  .tile.featured{grid-column:span 2;grid-row:span 2}
}

@media (prefers-reduced-motion:reduce){
  .tile{transition:none}
  .tile:hover{transform:none}
  .cap{transition:none}
}

.pe-foot{border-top:1px solid rgba(20,20,20,.15);margin-top:22px}
.pe-foot .inner{max-width:1120px;margin:0 auto;padding:34px 24px 60px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(20,20,20,.55)}
.pe-foot a{color:rgba(20,20,20,.55);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.pe-foot a:hover{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}

@media(max-width:860px){.navlinks{display:none}}
</style>
</head>
<body>
<div class="vignette"></div>

<div id="site-header"></div>

<div class="wrap">
  <header class="pe-head container">
    <div class="crumb"><a href="Personal.html" data-i18n="crumb.personal">Personal</a> <span>/</span> <span class="kick" data-i18n="card.effects.title">Personal Effects</span></div>
    <a class="backbtn" href="Personal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="back.personal">Back to Personal</span></a>
    <h1 data-i18n="effects.title">The stuff, off the clock</h1>
    <p class="dek" data-i18n="effects.dek">The hobbies and small obsessions, told in pictures. Hover or tap a tile to read the line behind it.</p>
  </header>

  <main class="container" id="pe-root"></main>

  <footer class="pe-foot">
    <div class="inner">
      <span>Darius Dantzler · Personal Effects</span>
      <a href="Personal.html">Back to Personal</a>
    </div>
  </footer>
</div>

<script>

/* ================= DATA (the whole interface — swap the real items in later) =================
   Shape: [{ id, label, items:[{ id, title, image, caption, size:"standard"|"featured" }] }]
   image "placeholder.jpg" (or missing) falls back to a generated bone/ink/yellow tile.
   ~2:1 standard-to-featured mix per section. */
const personalEffects = [
  {
    id:"hobbies", label:"hobbies",
    items:[
      { id:"h1", title:"Film photography", image:"placeholder.jpg", caption:"Shooting on a beat-up 35mm and hoping the light was right.", size:"featured" },
      { id:"h2", title:"Bread", image:"placeholder.jpg", caption:"Two years of sourdough and still learning the dough.", size:"standard" },
      { id:"h3", title:"Trail running", image:"placeholder.jpg", caption:"Early mileage before the city wakes up.", size:"standard" },
      { id:"h4", title:"Vinyl", image:"placeholder.jpg", caption:"Slowly outgrowing the shelf it lives on.", size:"standard" },
      { id:"h5", title:"Woodworking", image:"placeholder.jpg", caption:"Small joinery projects, mostly for the house.", size:"featured" },
      { id:"h6", title:"Chess", image:"placeholder.jpg", caption:"Better at openings than at endgames.", size:"standard" },
      { id:"h7", title:"Cycling", image:"placeholder.jpg", caption:"Long weekend loops out past the ridge.", size:"standard" },
      { id:"h8", title:"Sketching", image:"placeholder.jpg", caption:"A pocket notebook that never quite fills up.", size:"featured" }
    ]
  },
  {
    id:"games", label:"games",
    items:[
      { id:"g1", title:"Outer Wilds", image:"placeholder.jpg", caption:"The one I wish I could play again for the first time.", size:"featured" },
      { id:"g2", title:"Hollow Knight", image:"placeholder.jpg", caption:"Beautiful, brutal, and somehow calming.", size:"standard" },
      { id:"g3", title:"Tetris", image:"placeholder.jpg", caption:"The forever game. Still on the phone.", size:"standard" },
      { id:"g4", title:"Disco Elysium", image:"placeholder.jpg", caption:"More novel than game, and I mean that fondly.", size:"featured" },
      { id:"g5", title:"Celeste", image:"placeholder.jpg", caption:"A platformer that turned out to be about a lot more.", size:"standard" },
      { id:"g6", title:"Chess.com", image:"placeholder.jpg", caption:"The late-night blitz habit I can't shake.", size:"standard" },
      { id:"g7", title:"Journey", image:"placeholder.jpg", caption:"Ninety wordless minutes I think about often.", size:"standard" },
      { id:"g8", title:"Stardew Valley", image:"placeholder.jpg", caption:"Rainy-day comfort food, in game form.", size:"featured" }
    ]
  }
];

/* ---------- placeholder art generator (bone/ink/yellow only) ---------- */
function placeholderArt(section, i){
  const bone="#f5f3ec", ink="#141414", yellow="#f2c230";
  const schemes=[
    {bg:ink, fg:yellow, dim:"#33332f"},
    {bg:bone, fg:ink, dim:"#c9c6bd"},
    {bg:yellow, fg:ink, dim:"#cfa524"},
    {bg:ink, fg:bone, dim:"#33332f"},
    {bg:bone, fg:yellow, dim:"#d9c489"},
    {bg:ink, fg:yellow, dim:"#26261f"},
    {bg:yellow, fg:ink, dim:"#e0b93f"},
    {bg:bone, fg:ink, dim:"#bdb9ad"}
  ];
  const s=schemes[i%schemes.length];
  const W=400,H=400;
  let motif="";
  if(section==="hobbies"){
    // camera-shutter aperture blades
    let blades="";
    for(let k=0;k<6;k++){const a=k*60;blades+=`<path d="M200 200 L200 92 L294 146 Z" fill="${s.fg}" opacity="${k%2?0.85:0.6}" transform="rotate(${a} 200 200)"/>`;}
    motif=`<circle cx="200" cy="200" r="120" fill="none" stroke="${s.fg}" stroke-width="8"/>${blades}<circle cx="200" cy="200" r="30" fill="${s.bg}"/>`;
  } else {
    // controller d-pad + buttons
    motif=`<rect x="120" y="176" width="48" height="16" rx="4" fill="${s.fg}"/><rect x="136" y="160" width="16" height="48" rx="4" fill="${s.fg}"/>`
      +`<circle cx="256" cy="172" r="13" fill="${s.fg}"/><circle cx="290" cy="200" r="13" fill="${s.fg}"/><circle cx="256" cy="228" r="13" fill="${s.fg}"/><circle cx="222" cy="200" r="13" fill="${s.fg}"/>`
      +`<rect x="96" y="132" width="208" height="136" rx="52" fill="none" stroke="${s.fg}" stroke-width="8"/>`;
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
    +`<rect width="${W}" height="${H}" fill="${s.bg}"/>`
    +`<rect x="14" y="14" width="${W-28}" height="${H-28}" fill="none" stroke="${s.dim}" stroke-width="2"/>`
    +motif+`</svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
function imgFor(section,e,idx){ return e.image && e.image!=="placeholder.jpg" ? e.image : placeholderArt(section, idx); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- reusable wall renderer (one component, rendered per section) ---------- */
const openTiles=new Set();
function renderWall(section){
  const sec=document.createElement('section');
  sec.className='pe-section';
  sec.setAttribute('aria-label', section.label);

  const label=document.createElement('div');
  label.className='pe-label';
  label.setAttribute('data-i18n','pe.'+section.id);
  label.textContent=section.label;
  sec.appendChild(label);

  const grid=document.createElement('div');
  grid.className='bento';

  section.items.forEach((e,idx)=>{
    const tile=document.createElement('button');
    tile.type='button';
    tile.className='tile'+(e.size==='featured'?' featured':'');

    tile.innerHTML=
      '<img alt="" src="'+imgFor(section.id,e,idx)+'">'+
      '<div class="cap">'+
        '<div class="cap-kick" data-i18n="pe.'+section.id+'">'+esc(section.label)+'</div>'+
        '<div class="cap-title"'+(section.id==='hobbies'?' data-i18n="pe.'+e.id+'.t"':'')+'>'+esc(e.title)+'</div>'+
        (e.caption?'<div class="cap-text" data-i18n="pe.'+e.id+'.c">'+esc(e.caption)+'</div>':'')+
      '</div>';

    const img=tile.querySelector('img');
    img.addEventListener('error',function(){ this.onerror=null; this.src=placeholderArt(section.id, idx); });

    tile.addEventListener('click',ev=>{
      ev.stopPropagation();
      const on=tile.classList.toggle('show');
      if(on){ openTiles.add(tile); } else { openTiles.delete(tile); }
    });

    grid.appendChild(tile);
  });

  sec.appendChild(grid);
  return sec;
}

const root=document.getElementById('pe-root');
personalEffects.forEach(section=>root.appendChild(renderWall(section)));
if(window.ddsI18n) window.ddsI18n.apply(root);
window.addEventListener('ddslangchange',()=>{ if(window.ddsI18n) window.ddsI18n.apply(document); });

/* tap elsewhere dismisses any tapped-open overlays */
document.addEventListener('click',e=>{
  if(e.target.closest('.tile')) return;
  openTiles.forEach(t=>t.classList.remove('show'));
  openTiles.clear();
});
</script>
<script src="i18n.js"></script>
<script src="site-chrome.js"></script>
</body>
</html>
