<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project · Darius Dantzler</title>
<meta name="description" content="A closer look at one project: the gap it addressed, what was actually built, and the evidence it produced.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://darius-dantzler.vercel.app/Project.html">
<meta property="og:site_name" content="Darius Dantzler">
<meta property="og:title" content="Project · Darius Dantzler">
<meta property="og:description" content="A closer look at one project: the gap it addressed, what was actually built, and the evidence it produced.">
<meta property="og:image" content="https://darius-dantzler.vercel.app/assets/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--dds-color-bone);color:var(--dds-color-ink);font-family:var(--dds-font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--dds-color-ink);text-decoration:none}
a:hover{color:var(--dds-color-ink)}

.vignette{position:fixed;inset:0;z-index:0;pointer-events:none}
.vignette::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, rgba(242,194,48,.05), transparent 55%),
  radial-gradient(140% 120% at 50% 42%, rgba(245,243,236,0) 55%, rgba(20,20,20,.05) 100%)}

/* floating pill header (shared identity) */
.pillbar{position:fixed;top:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 20px;pointer-events:none}
.pill{pointer-events:auto;width:100%;max-width:1120px;display:flex;align-items:center;gap:22px;padding:11px 14px 11px 24px;border-radius:999px;border:1px solid rgba(20,20,20,.12);background:rgba(248,246,240,.82);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);box-shadow:0 1px 1px rgba(20,20,20,.03),0 8px 26px rgba(20,20,20,.09)}
.brand{font-family:var(--dds-font-serif);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;padding-right:4px}
.navlinks{display:flex;align-items:center;gap:20px;margin-left:auto}
.navlink{font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(20,20,20,.6);border-bottom:2px solid transparent;padding:2px 0;transition:color .15s,border-color .15s;white-space:nowrap}
.navlink:hover{color:var(--dds-color-ink)}
.navlink.active{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
.pill-tools{display:flex;align-items:center;gap:6px;padding-left:14px;margin-left:2px;border-left:1px solid rgba(20,20,20,.12)}
.icobtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;border:1px solid transparent;color:rgba(20,20,20,.7);background:transparent;cursor:pointer;transition:background .15s,color .15s}
.icobtn:hover{background:rgba(20,20,20,.06);color:var(--dds-color-ink)}
.icobtn:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:2px}
.icobtn svg{width:18px;height:18px;display:block}
.lang{position:relative}
.lang-menu{position:absolute;top:calc(100% + 12px);right:0;min-width:172px;background:var(--dds-color-bone);border:1px solid rgba(20,20,20,.14);border-radius:14px;box-shadow:0 10px 30px rgba(20,20,20,.14);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s}
.lang.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0)}
.lang-head{font-family:var(--dds-font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(20,20,20,.45);padding:8px 10px 6px}
.lang-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;padding:9px 10px;border-radius:9px;font-family:var(--dds-font-sans);font-size:.9rem;color:var(--dds-color-ink);transition:background .12s}
.lang-item:hover{background:rgba(20,20,20,.06)}
.lang-item:focus-visible{outline:2px solid var(--dds-color-accent);outline-offset:-2px}
.lang-item .code{font-family:var(--dds-font-mono);font-size:.66rem;color:rgba(20,20,20,.5)}
.lang-item[aria-checked="true"] .code{color:var(--dds-color-ink)}
.lang-item .tick{width:14px;height:14px;color:var(--dds-color-accent);opacity:0}
.lang-item[aria-checked="true"] .tick{opacity:1}

.wrap{position:relative;z-index:1}
.container{max-width:900px;margin:0 auto;padding:0 24px}

/* header */
.pj-head{padding-top:140px}
.crumb{display:inline-flex;align-items:center;gap:8px;font-family:var(--dds-font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(20,20,20,.5);margin-bottom:22px}
.crumb a{color:rgba(20,20,20,.5);border-bottom:1px solid transparent;transition:color .15s,border-color .15s}
.crumb a:hover{color:var(--dds-color-ink);border-bottom-color:var(--dds-color-accent)}
.pj-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pj-dates{font-family:var(--dds-font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(20,20,20,.55)}
.pj-status{white-space:nowrap;font-family:var(--dds-font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 10px;border-radius:999px;border:1px solid var(--st-color,rgba(20,20,20,.4));color:var(--dds-color-ink)}
.pj-title{font-family:var(--dds-font-serif);font-weight:600;letter-spacing:-.015em;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.04;margin:0}
.pj-sub{margin-top:16px;font-size:1.2rem;line-height:1.5;color:rgba(20,20,20,.72);max-width:60ch;text-wrap:pretty}
.pj-role{margin-top:18px;font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(20,20,20,.6);display:inline-flex;align-items:center;gap:9px}
.pj-role::before{content:"";width:20px;height:1px;background:var(--dds-color-accent)}

/* hero band */
.pj-band{position:relative;height:230px;margin:34px 0 6px;border-radius:16px;overflow:hidden;border:1px solid rgba(20,20,20,.6)}
.pj-band img{width:100%;height:100%;object-fit:cover;display:block}

/* body sections */
.pj-body{padding:24px 0 20px}
.section{padding:26px 0;border-top:1px solid rgba(20,20,20,.14)}
.section:first-child{border-top:0}
.sec-label{font-family:var(--dds-font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(20,20,20,.5);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:"";flex:1;height:1px;background:rgba(20,20,20,.1)}
.sec-body{font-size:1.08rem;line-height:1.62;color:rgba(20,20,20,.82);max-width:66ch;text-wrap:pretty}
.sec-body p{margin:0 0 12px}
.sec-body p:last-child{margin-bottom:0}

/* tools */
.tools{display:flex;flex-wrap:wrap;gap:9px}
.toolpill{font-family:var(--dds-font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(20,20,20,.75);border:1px solid rgba(20,20,20,.3);border-radius:999px;padding:6px 13px;white-space:nowrap}

/* highlights — evidence */
.hl{display:grid;gap:12px}
.hl-item{position:relative;display:flex;gap:14px;align-items:flex-start;background:#faf8f1;border:1px solid rgba(20,20,20,.16);border-radius:12px;padding:15px 18px 15px 16px}
.hl-item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--dds-color-accent)}
.hl-num{flex:0 0 auto;font-family:var(--dds-font-mono);font-size:.7rem;color:rgba(20,20,20,.4);padding-top:2px;min-width:20px}
.hl-text{font-size:1.02rem;line-height:1.5;color:var(--dds-color-ink);text-wrap:pretty}

/* links */
.links{display:flex;flex-wrap:wrap;gap:12px}
.linkbtn{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;background:var(--dds-color-accent);color:var(--dds-color-ink);border:1px solid var(--dds-color-ink);font-family:var(--dds-font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;transition:transform .15s,box-shadow .15s}
.linkbtn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,20,20,.18)}
.linkbtn svg{width:14px;height:14px}

/* footer nav */
.pj-foot{border-top:1px solid rgba(20,20,20,.15);margin-top:26px}
.pj-foot .inner{max-width:900px;margin:0 auto;padding:30px 24px 64px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.backlink{display:inline-flex;align-items:center;gap:9px;font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dds-color-ink);border-bottom:1px solid rgba(20,20,20,.25);padding-bottom:2px;transition:gap .15s,border-color .15s}
.backlink:hover{gap:12px;border-bottom-color:var(--dds-color-accent)}
.backlink svg{width:15px;height:15px}
.pj-foot .sig{font-family:var(--dds-font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:rgba(20,20,20,.5)}

/* not-found */
.notfound{padding:180px 0 120px;text-align:center}
.notfound h1{font-family:var(--dds-font-serif);font-weight:600;font-size:2.2rem;margin:0 0 12px}
.notfound p{color:rgba(20,20,20,.65);font-size:1.05rem}

@media(max-width:600px){.pj-head{padding-top:118px}.pj-band{height:170px}}
@media(max-width:860px){.navlinks{display:none}}
@media (prefers-reduced-motion:reduce){.linkbtn:hover,.backlink:hover{transform:none}}
</style>
</head>
<body>
<div class="vignette"></div>

<div id="site-header"></div>

<div class="wrap" id="root"></div>

<script src="projects-data.js"></script>
<script>

const STATUS = window.PROJECT_STATUS;
const STATUS_COLOR = { "in-progress":"#f2c230", "shipped":"#17693a", "concept":"#8a8a86" };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* placeholder hero band (bone/ink/yellow only) — distinct motif per project */
function bandMotif(id){
  if(id==="t1d-supply-hub") // medical cross + supply boxes
    return '<g transform="translate(450 115)"><rect x="-16" y="-52" width="32" height="104" rx="6" fill="#f2c230"/><rect x="-52" y="-16" width="104" height="32" rx="6" fill="#f2c230"/></g>'
      +'<g stroke="#33332f" stroke-width="4" fill="none" opacity=".8"><rect x="150" y="150" width="52" height="40" rx="4"/><rect x="698" y="42" width="52" height="40" rx="4"/></g>';
  if(id==="air-quality-app") // map pin + emission plume waves
    return '<g fill="none" stroke="#f2c230" stroke-width="8"><path d="M300 60c0 46-60 92-60 92s-60-46-60-92a60 60 0 0 1 120 0Z"/></g><circle cx="240" cy="60" r="18" fill="#141414" stroke="#f2c230" stroke-width="8"/>'
      +'<g stroke="#f2c230" stroke-width="6" fill="none" opacity=".7"><path d="M470 150q30-40 60 0t60 0 60 0 60 0"/><path d="M470 180q30-40 60 0t60 0 60 0 60 0"/></g>';
  if(id==="intern-reimbursement-tracker") // stacked coins + check
    return '<g fill="none" stroke="#f2c230" stroke-width="8"><ellipse cx="330" cy="80" rx="70" ry="24"/><path d="M260 80v55c0 13 31 24 70 24s70-11 70-24V80"/></g>'
      +'<g stroke="#f2c230" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M545 118l30 30 60-70"/></g>';
  // generic fallback
  return '<g stroke="#f2c230" stroke-width="8" fill="none" opacity="0.9"><circle cx="450" cy="115" r="70"/></g><circle cx="450" cy="115" r="10" fill="#f2c230"/>';
}
function placeholderBand(seed){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">'
    +'<rect width="900" height="230" fill="#141414"/>'
    +bandMotif(String(seed||''))
    +'<rect x="10" y="10" width="880" height="210" fill="none" stroke="#33332f" stroke-width="2"/>'
    +'</svg>';
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}

const root = document.getElementById('root');
const params = new URLSearchParams(location.search);
const id = params.get('id');
const p = (window.PROJECTS||[]).find(x => x.id === id);

const canon = document.querySelector('link[rel="canonical"]');

if(!p){
  // Soft 404. The server still returns 200, so tell crawlers not to index
  // the not-found state rather than let it compete with the real pages.
  const nx = document.createElement('meta');
  nx.name = 'robots'; nx.content = 'noindex';
  document.head.appendChild(nx);
  root.innerHTML =
    '<div class="container notfound">' +
      '<h1>Project not found</h1>' +
      '<p>That project link doesn\u2019t match anything in the list.</p>' +
      '<p style="margin-top:22px"><a class="backlink" href="Projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back to all projects</a></p>' +
    '</div>';
} else {
  document.title = p.title + ' · Darius Dantzler';
  // Each project is its own document; without this every ?id= would
  // canonicalise to the bare template, which renders "Project not found".
  const self = 'https://darius-dantzler.vercel.app/Project.html?id=' + encodeURIComponent(p.id);
  if (canon) canon.href = self;
  const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el && val) el.setAttribute('content', val); };
  setMeta('meta[property="og:url"]', self);
  setMeta('meta[property="og:title"]', p.title + ' · Darius Dantzler');
  setMeta('meta[name="description"]', p.subtitle);
  setMeta('meta[property="og:description"]', p.subtitle);
  const color = STATUS_COLOR[p.status] || "rgba(20,20,20,.4)";
  const img = (p.image && p.image !== 'placeholder.jpg') ? p.image : placeholderBand(p.id);

  const tools = (p.tools||[]).map(t=>'<span class="toolpill">'+esc(t)+'</span>').join('');
  const approachHtml = String(p.approach||'').split('\n').filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');
  const highlights = (p.highlights||[]).map((h,i)=>
    '<div class="hl-item"><span class="hl-num">'+String(i+1).padStart(2,'0')+'</span><span class="hl-text">'+esc(h)+'</span></div>'
  ).join('');
  const links = (p.links||[]).filter(l=>l&&l.url).map(l=>
    '<a class="linkbtn" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label||'Visit')+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></a>'
  ).join('');

  root.innerHTML =
    '<header class="pj-head container" style="--st-color:'+color+'">' +
      '<div class="crumb"><a href="index.html">Home</a> <span>/</span> <a href="Projects.html">Projects</a> <span>/</span> <span>'+esc(p.title)+'</span></div>' +
      '<div class="pj-meta">' +
        '<span class="pj-dates">'+esc(p.dates||'')+'</span>' +
        '<span class="pj-status">'+esc(STATUS[p.status]||p.status||'')+'</span>' +
      '</div>' +
      '<h1 class="pj-title">'+esc(p.title)+'</h1>' +
      (p.subtitle?'<p class="pj-sub">'+esc(p.subtitle)+'</p>':'') +
      (p.role?'<div class="pj-role">'+esc(p.role)+'</div>':'') +
    '</header>' +
    '<div class="container"><div class="pj-band"><img alt="" src="'+img+'"></div></div>' +
    '<div class="container pj-body">' +
      (p.problem?'<section class="section"><div class="sec-label">The problem</div><div class="sec-body"><p>'+esc(p.problem)+'</p></div></section>':'') +
      (approachHtml?'<section class="section"><div class="sec-label">What I did</div><div class="sec-body">'+approachHtml+'</div></section>':'') +
      (tools?'<section class="section"><div class="sec-label">Tools &amp; skills</div><div class="tools">'+tools+'</div></section>':'') +
      (highlights?'<section class="section"><div class="sec-label">Results</div><div class="hl">'+highlights+'</div></section>':'') +
      (links?'<section class="section"><div class="sec-label">Links</div><div class="links">'+links+'</div></section>':'') +
    '</div>' +
    '<footer class="pj-foot"><div class="inner">' +
      '<a class="backlink" href="Projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>All projects</a>' +
      '<span class="sig">Darius Dantzler · Projects</span>' +
    '</div></footer>';
}
</script>
<script src="i18n.js"></script>
<script src="site-chrome.js"></script>
</body>
</html>
